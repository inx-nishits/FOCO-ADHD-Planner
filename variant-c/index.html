<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Native iOS-like PWA foundation" />

    <!-- iOS / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="App" />
    <meta name="format-detection" content="telephone=no" />

    <title>App Foundation</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/device-frame.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/preview.css" />
    <link rel="stylesheet" href="/css/animations.css" />
    <link rel="stylesheet" href="/css/variants.css" />
  </head>
  <body>
    <div class="app-stage">
      <!--
        Desktop presentation frame.
        Hardware layer (chassis, buttons, Dynamic Island) is separate from the app viewport.
      -->
      <div class="device-frame-slot">
      <div class="device-frame" role="presentation">
        <!-- Physical side buttons (outside the screen) -->
        <div class="device-frame__sides" aria-hidden="true">
          <span class="device-frame__btn device-frame__btn--action"></span>
          <span class="device-frame__btn device-frame__btn--vol-up"></span>
          <span class="device-frame__btn device-frame__btn--vol-down"></span>
          <span class="device-frame__btn device-frame__btn--power"></span>
        </div>

        <div class="device-frame__chassis">
          <div class="device-frame__bezel">
            <!-- App viewport layer -->
            <div class="device-frame__screen">
              <div class="app-shell">
                <main id="app" role="main">
                  <section
                    id="screen"
                    class="app-screen"
                    aria-label="Application"
                  ></section>
                </main>
              </div>

              <!-- Device hardware overlay (display glass layer — above app, not app content) -->
              <div class="device-frame__hardware" aria-hidden="true">
                <div class="device-frame__island">
                  <span class="device-frame__island-speaker"></span>
                  <span class="device-frame__island-camera"></span>
                </div>
              </div>

              <!-- Home indicator: inside screen safe area, not app content -->
              <div class="device-frame__home-indicator" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>

    <!-- Variant control only — injected when developmentPreview is true -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
